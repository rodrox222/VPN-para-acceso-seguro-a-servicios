version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: api-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-helpdesk}
      POSTGRES_USER: ${POSTGRES_USER:-helpdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en el archivo .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - vpn_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-rest:
    build: ./api
    container_name: api-rest
    restart: unless-stopped
    # Mapeo estricto a la IP de la VPN
    ports:
      - "${VPN_BIND_IP:-10.0.0.1}:${API_PORT:-5000}:5000"
    networks:
      vpn_net:
        ipv4_address: ${API_IP:-172.18.0.10}
    # Endurecimiento de seguridad
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Gunicorn requiere escribir archivos temporales
    tmpfs:
      - /tmp
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-helpdesk}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-helpdesk}
      AUTH_SECRET: ${AUTH_SECRET:-secreto-super-seguro-compartido-en-ambos-servidores}

networks:
  vpn_net:
    name: br-vpnapi
    ipam:
      config:
        - subnet: ${API_SUBNET:-172.18.0.0/24}

volumes:
  pgdata:
